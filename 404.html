<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Antonio Giménez Alcázar</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260914b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%2300a97f' stroke-width='2.5'/><circle cx='16' cy='16' r='3' fill='%2300a97f'/></svg>">
<script>
(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
</script>
<style>
  .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .lost-in { max-width: 52ch; padding: var(--pad); }
  .lost h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(40px, 8vw, 72px); line-height: 1.05;
    letter-spacing: -0.025em; margin: 0 0 18px;
  }
  .lost .code {
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent-2); margin: 0 0 20px;
  }
  .lost p.msg { font-size: 17px; color: var(--ink-2); margin: 0 0 32px; text-wrap: pretty; }
</style>
</head>
<body>
<main class="lost">
  <div class="lost-in">
    <p class="code">Error 404</p>
    <h1>Nothing at these coordinates</h1>
    <p class="msg">This page does not exist — or it moved. Nothing was detected above the noise here, which happens more often than you would like in this line of work.</p>
    <div class="hero-links" style="justify-content: center;">
      <a class="btn btn-primary" href="/">Back to the front page</a>
      <a class="btn" href="/#publications">Publications</a>
    </div>
  </div>
</main>
</body>
</html>
